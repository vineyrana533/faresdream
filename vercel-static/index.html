<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FaresDream</title>
<meta http-equiv="refresh" content="0; url=https://www.faresdream.com/" />
<script>
  // Preserve the requested path/query/hash when bouncing to the live site.
  location.replace(
    "https://www.faresdream.com/" +
    location.pathname.replace(/^\//, "") +
    location.search +
    location.hash
  );
</script>
</head>
<body style="font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0">
  <p>Redirecting to <a href="https://www.faresdream.com/">faresdream.com</a>&hellip;</p>
</body>
</html>
